<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tak Tak — Página no encontrada</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f0f0f;
        color: #fff;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      .box {
        max-width: 640px;
        padding: 48px 28px;
        background: #171717;
        border: 2px solid #2b2b2b;
        border-radius: 20px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 5vw, 4rem);
        background: linear-gradient(90deg, #ff6b00, #ffcc00);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        color: #d6d6d6;
        margin-bottom: 22px;
      }

      a {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff6b00, #ff9500);
        color: #111;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>404</h1>
      <p>La página que buscas no existe o fue movida.</p>
      <a href="/">Volver a Tak Tak</a>
    </div>
  </body>
</html>
