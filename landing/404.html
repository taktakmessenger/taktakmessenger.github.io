<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tak Tak — Página no encontrada</title>
    <style>
      :root {
        --bg: #0f0f0f;
        --panel: #171717;
        --line: #2d2d2d;
        --orange: #ff6b00;
        --gold: #ffd166;
        --text: #f5f5f5;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      .box {
        width: min(92vw, 640px);
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 20px;
        padding: 46px 28px;
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2.3rem, 7vw, 4.8rem);
        background: linear-gradient(90deg, var(--orange), var(--gold));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        color: #d9d9d9;
        margin-bottom: 22px;
      }

      a {
        display: inline-block;
        background: linear-gradient(90deg, var(--orange), #ff9300);
        color: #111;
        padding: 14px 28px;
        border-radius: 999px;
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>404</h1>
      <p>La página que buscas no existe o fue movida.</p>
      <a href="/">Volver a Tak Tak</a>
    </div>
  </body>
</html>
