version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: taktak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taktak
      POSTGRES_PASSWORD: taktakpass
      POSTGRES_DB: taktak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taktak -d taktak"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taktak_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: taktak_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    container_name: taktak_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/taktak-videos --ignore-existing;
      /usr/bin/mc anonymous set download local/taktak-videos;
      exit 0;
      "

  ffmpeg:
    image: jrottenberg/ffmpeg:4.4-ubuntu
    container_name: taktak_ffmpeg
    entrypoint: ["sleep", "infinity"]
    volumes:
      - tempvideos:/tmp/videos

volumes:
  pgdata:
  redisdata:
  miniodata:
  tempvideos:
