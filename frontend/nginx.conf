server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing: unknown paths fall back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # nginx defaults to 1 MB, which rejects every video upload with a 413 before
  # the request ever reaches the backend. The backend allows 50 MB
  # (MAX_VIDEO_BYTES), so the proxy must accept at least that.
  client_max_body_size 60m;

  # Forward API calls to the backend service on the compose network.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO shares the backend HTTP server. Without the upgrade headers the
  # handshake fails and the live chat and calls never connect.
  location /socket.io/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded originals and HLS renditions are served by the backend, which is
  # the only service with the storage mounted.
  location /uploads/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
