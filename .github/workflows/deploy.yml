# GitHub Pages for this repo is served directly from the `main` branch
# (Settings > Pages > source: "Deploy from a branch"), so the live site is the
# repository root: /, /taktak-app/, /landing/, etc.
#
# Publishing through actions/deploy-pages is incompatible with that mode: it
# uploads only ./dist as the whole site, which would replace the repository root
# and take /taktak-app/ and /landing/ offline. This workflow therefore only
# verifies that the Vite build still succeeds. It deploys nothing.
name: Build check

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
