# GitHub Pages for this repo is served directly from the `main` branch
# (Settings > Pages > source: "Deploy from a branch"). Publishing through
# actions/deploy-pages is incompatible with that mode, so this workflow only
# verifies that the Vite build still succeeds. It does not deploy anything.
name: Build check

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
