# TAK TAK en Render: un solo servicio web (la web y la API juntas).
#
# Despliegue estrictamente gratuito: nada de pago, nada que consuma de más.
#
#  - El frontend llama a `/api` y a Socket.IO con rutas relativas, así que todo
#    tiene que salir del mismo origen. Con dos servicios habría que proxear.
#  - El plan gratuito da 750 horas de instancia al mes por espacio de trabajo.
#    Dos servicios encendidos 24/7 son unas 1440 horas: se agotan hacia el día
#    15 y Render suspende los dos hasta el mes siguiente. Con uno solo hay
#    margen para el mes entero.
#
# Por qué NO hay worker keep-alive:
#
#  Los background workers no tienen plan gratuito (Render solo da instancia Free
#  a web services, static sites, Postgres y Key Value). Añadirlo obliga a pagar.
#  Y de todos modos no serviría: con el plan free el servicio web se duerme a
#  los 15 min de inactividad, y despierta en ~1 min al primer acceso. Para el
#  cobro manual eso no rompe nada: no hay webhooks esperando respuesta, el pago
#  lo confirma un administrador al entrar. Si algún día quieres 24/7, descomenta
#  el bloque del final y asume el coste.
#
# La base de datos no está aquí a propósito: la app usa transacciones y eso
# exige un replica set, así que Mongo va en Atlas y su cadena llega en
# MONGODB_URI.
#
# Variables marcadas con sync: false no se leen del repo: se rellenan en el
# panel de Render (secrets) y no se sincronizan en cada despliegue.

services:
  # --- Web y API, en el mismo proceso ---
  - type: web
    name: taktak
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # El contexto es la raíz porque la imagen construye el frontend y necesita
    # backend/ y frontend/. El build del frontend ocurre dentro de la imagen, en
    # una etapa aparte: no hay que compilarlo a mano antes de desplegar.
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render inyecta PORT en el contenedor y espera que escuche ahí.
      - key: PORT
        value: 10000
      # Cadena de MongoDB Atlas, con ?replicaSet=... incluido.
      - key: MONGODB_URI
        sync: false
      # Firma de los JWT. Render genera un valor aleatorio y lo mantiene.
      - key: JWT_SECRET
        generateValue: true
      # La web y la API comparten origen, así que CORS y los enlaces absolutos
      # que se envían por correo apuntan a la propia URL del servicio.
      - key: CORS_ORIGIN
        fromService:
          name: taktak
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_URL
        fromService:
          name: taktak
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # ffmpeg sí está en la imagen. La transcodificación se deja ACTIVADA
      # porque sin ella el vídeo se sirve tal cual y un original de iPhone
      # (H.265/HEVC) o de Android reciente (AV1) se ve en negro en la mayoría de
      # los navegadores: no hay H.264 que decodificar ni miniatura que enseñar.
      # El coste es ffmpeg en runtime dentro del plan gratuito, que es asumible
      # frente a tener los vídeos ilegibles.
      - key: TRANSCODE_ENABLED
        value: "true"
      # Tamaño máximo por vídeo. El valor por defecto (50 MB) se queda corto: un
      # vídeo normal de móvil pesa más y la subida fallaba con 413. El plan free
      # tiene 512 MB de RAM, pero multer escribe a disco en streaming, así que el
      # tope real lo pone el proxy de Render, no la memoria. 200 MB da margen sin
      # acercarse a ese tope.
      - key: MAX_VIDEO_BYTES
        value: 209715200
      # Almacenamiento externo compatible con S3 (Cloudflare R2). Sin esto los
      # vídeos viven en el disco del contenedor, que Render borra en cada
      # despliegue: se pierden y sus enlaces quedan rotos. Con el bucket
      # configurado, original y HLS se publican ahí y sobreviven a los reinicios.
      # Mientras estas variables falten, la app sigue en modo local sin fallar.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # URL pública del bucket (https://pub-xxxx.r2.dev), sin barra final.
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # Región del proveedor. `auto` para Cloudflare R2; para Backblaze B2 hay
      # que copiarla del endpoint del panel (p. ej. us-west-004).
      - key: R2_REGION
        value: auto
      # B2 sirve los objetos en /bucket/clave y lo necesita activado.
      - key: R2_FORCE_PATH_STYLE
        value: "false"
      # Render no ofrece puertos UDP: el SFU de mediasoup no puede funcionar y
      # el modo malla es el único disponible.
      - key: SFU_ENABLED
        value: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Cobro manual. Va con valor y no como secreto porque son los datos de pago
      # que se le muestran al usuario, no credenciales.
      # Cobro SOLO con billetera cripto (TakCoin / TKC en Polygon).
      # `asset`+`network` hacen que la tienda lo pinte como billetera con QR; la
      # dirección es la del admin, que es quien recibe el TKC de las compras.
      # El backend detecta `asset: TKC` y acredita monedas de REGALO (no
      # retirables): el TKC se regala minando, así que pagar con él no puede dar
      # monedas canjeables por dinero real (si no, sería una fuga).
      - key: MANUAL_PAYMENT_METHODS
        value: '[{"id":"tkc-polygon","label":"TakCoin (Polygon)","asset":"TKC","network":"POLYGON","payTo":"0xb8ae095350e8b141204b4bd61894be08efed54fc","details":"Envía TakCoin (TKC) por la red Polygon a esta dirección y pega el hash de la transacción."}]'
      # Billeteras del sistema: la del admin (40%) y la bóveda (60%).
      - key: CRYPTO_NETWORK
        value: BEP20
      - key: CRYPTO_ADMIN_ADDRESS
        value: '0xb8ae095350e8b141204b4bd61894be08efed54fc'
      - key: CRYPTO_VAULT_ADDRESS
        value: '0xa5104da3580c390ce8d0e76c6aaafb0d66f3fa04'
      - key: CRYPTO_USDT_CONTRACT
        value: '0x55d398326f99059fF775485246999027B3197955'
      - key: CRYPTO_USDT_DECIMALS
        value: '18'
      - key: CRYPTO_RPC_URL
        value: 'https://bsc-dataseed.binance.org'
      # Pago automático de retiros desde la bóveda. Apagado: exige la clave
      # privada de la bóveda en el servidor. Con false, el admin paga a mano.
      - key: CRYPTO_VAULT_PAYOUT_ENABLED
        value: 'false'
      # Asistente de revisión (opcional). Sin clave queda apagado y el panel
      # manual funciona igual. La base y el modelo deben ir juntos: el modelo es
      # el que entiende esa base (gpt-oss-120b es de Groq, gpt-4o-mini de OpenAI).
      - key: ASSISTANT_API_KEY
        sync: false
      # Claves de respaldo separadas por comas. Si la principal falla, se prueba
      # la siguiente antes de rendirse.
      - key: ASSISTANT_API_KEY_FALLBACK
        sync: false
      - key: ASSISTANT_API_BASE
        value: https://api.groq.com/openai/v1
      - key: ASSISTANT_MODEL
        value: openai/gpt-oss-120b
      # Aprobación automática: déjalo en false hasta que confíes en el asistente.
      - key: MANUAL_AUTO_APPROVE
        value: false

  # --- Keep-alive (OPCIONAL, DE PAGO) ---------------------------------------
  # Comentado a propósito: los background workers no tienen plan gratuito, así
  # que dejarlo activo obliga a pagar (~7 USD/mes). Descomenta el bloque entero
  # (y quita la indentación del comentario) si algún día quieres 24/7.
  #
  # - type: worker
  #   name: taktak-keepalive
  #   runtime: docker
  #   dockerfilePath: ./scripts/keepalive.Dockerfile
  #   dockerContext: ./scripts
  #   region: oregon
  #   plan: starter
  #   envVars:
  #     # La base se rellena sola desde la URL del servicio web, así que renombrar
  #     # el servicio no deja el keep-alive apuntando a un host inexistente. El
  #     # script le añade /health. Cualquier petición de entrada cuenta como
  #     # actividad; el health además confirma que el servicio responde de verdad.
  #     - key: KEEPALIVE_BASE_URL
  #       fromService:
  #         name: taktak
  #         type: web
  #         envVarKey: RENDER_EXTERNAL_URL
  #     - key: KEEPALIVE_INTERVAL_MS
  #       value: 600000


