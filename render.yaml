# TAK TAK en Render: dos servicios web (API y frontend) que se hablan por la
# red privada de Render.
#
# No hay servicio de MongoDB aquí a propósito. La app necesita un replica set
# (usa transacciones en los regalos y en la cartera) y el contenedor de Mongo
# no se puede levantar como servicio normal en Render. La base de datos va en
# MongoDB Atlas, y su cadena se pone en MONGODB_URI.
#
# Variables marcadas con sync: false no se leen del repo: se rellenan en el
# panel de Render (secrets) y no se sincronizan en cada despliegue.
#
# Plan gratuito: los servicios se duermen tras 15 minutos sin tráfico y tardan
# cerca de un minuto en despertar. La primera visita del día siempre es lenta.

services:
  # --- API ---
  - type: web
    name: taktak-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render inyecta PORT en el contenedor y espera que escuche ahí.
      - key: PORT
        value: 10000
      # Cadena de MongoDB Atlas, con ?replicaSet=... incluido.
      - key: MONGODB_URI
        sync: false
      # Firma de los JWT. Render genera un valor aleatorio y lo mantiene.
      - key: JWT_SECRET
        generateValue: true
      # Origen permitido para CORS y para los enlaces absolutos que se envían
      # por correo (reset de contraseña). Es la URL del frontend.
      - key: CORS_ORIGIN
        fromService:
          name: taktak-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_URL
        fromService:
          name: taktak-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # La imagen no incluye ffmpeg, así que la transcodificación queda apagada.
      - key: TRANSCODE_ENABLED
        value: false
      # Render no ofrece puertos UDP: el SFU de mediasoup no puede funcionar y
      # el modo malla es el único disponible.
      - key: SFU_ENABLED
        value: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

  # --- Frontend (nginx + build de Vite) ---
  - type: web
    name: taktak-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: oregon
    plan: free
    envVars:
      - key: PORT
        value: 10000
      # nginx resuelve este nombre en cada petición, así que tiene que ser un
      # nombre que el DNS público conozca. El host interno de Render solo lo
      # resuelve su DNS privado, y aquí se usa el público (1.1.1.1), por eso se
      # apunta a la URL pública de la API y no a su host privado.
      - key: BACKEND_URL
        fromService:
          name: taktak-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: RESOLVER
        value: 1.1.1.1

