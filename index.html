    // Mini-Game 1: TakTak Beat Runner
    function BeatRunnerGame({ onFinishScore }) {
      const [score, setScore] = useState(0);
      const [gameOver, setGameOver] = useState(false);
      const [playerPos, setPlayerPos] = useState(50); // percentage
      const [obstacle, setObstacle] = useState({ x: 50, y: 0 });
      const [isPlaying, setIsPlaying] = useState(false);

      useEffect(() => {
        if (!isPlaying || gameOver) return;
        const interval = setInterval(() => {
          setObstacle(obs => {
            if (obs.y >= 90) {
              // Check collision
              if (Math.abs(obs.x - playerPos) < 25) {
                setGameOver(true);
                return obs;
              }
              setScore(s => s + 10);
              return { x: Math.floor(Math.random() * 80) + 10, y: 0 };
            }
            return { ...obs, y: obs.y + 4 };
          });
        }, 50);
        return () => clearInterval(interval);
      }, [isPlaying, gameOver, playerPos]);

      const startGame = () => {
        setScore(0);
        setGameOver(false);
        setObstacle({ x: 50, y: 0 });
        setIsPlaying(true);
      };

      return (
        <div style={{ width: '100%', height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
          <div style={{ position: 'absolute', top: 15, left: 20, fontSize: '18px', fontWeight: '900', color: '#ffd700' }}>
            🏆 Puntos: {score}
          </div>

          {!isPlaying && !gameOver && (
            <div style={{ textAlign: 'center', padding: 20 }}>
              <div style={{ fontSize: '42px', marginBottom: 10 }}>🎮</div>
              <h2 style={{ color: '#fff', fontSize: '20px', marginBottom: 8 }}>TakTak Beat Runner</h2>
              <p style={{ color: '#aaa', fontSize: '13px', marginBottom: 20 }}>Desliza o toca izquierda/derecha para esquivar las notas musicales neón.</p>
              <button className="gold-btn" onClick={startGame}>⚡ Iniciar Juego</button>
            </div>
          )}

          {isPlaying && !gameOver && (
            <div style={{ width: '100%', height: '100%', position: 'relative', overflow: 'hidden' }}>
              {/* Falling obstacle */}
              <div style={{
                position: 'absolute',
                top: `${obstacle.y}%`,
                left: `${obstacle.x}%`,
                transform: 'translate(-50%, -50%)',
                fontSize: '28px'
              }}>
                🎵
              </div>

              {/* Player */}
              <div style={{
                position: 'absolute',
                bottom: '15%',
                left: `${playerPos}%`,
                transform: 'translate(-50%, 0)',
                width: '44px',
                height: '44px',
                borderRadius: '50%',
                background: 'linear-gradient(135deg, #fe2c55, #25f4ee)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                fontSize: '22px',
                boxShadow: '0 0 15px #fe2c55',
                transition: 'left 0.1s ease'
              }}>
                🚀
              </div>

              {/* Controls */}
              <div style={{ position: 'absolute', bottom: 10, width: '100%', display: 'flex', justifyContent: 'space-between', padding: '0 20px' }}>
                <button
                  style={{ background: 'rgba(255,255,255,0.2)', border: 'none', color: '#fff', padding: '14px 28px', borderRadius: '12px', fontSize: '18px', fontWeight: 'bold' }}
                  onClick={() => setPlayerPos(p => Math.max(15, p - 20))}
                >
                  ◀ Izq
                </button>
                <button
                  style={{ background: 'rgba(255,255,255,0.2)', border: 'none', color: '#fff', padding: '14px 28px', borderRadius: '12px', fontSize: '18px', fontWeight: 'bold' }}
                  onClick={() => setPlayerPos(p => Math.min(85, p + 20))}
                >
                  Der ▶
                </button>
              </div>
            </div>
          )}

          {gameOver && (
            <div style={{ textAlign: 'center', padding: 20 }}>
              <div style={{ fontSize: '42px', marginBottom: 8 }}>💥</div>
              <h2 style={{ color: '#fe2c55', fontSize: '22px', marginBottom: 6 }}>¡Juego Terminado!</h2>
              <p style={{ color: '#fff', fontSize: '16px', marginBottom: 18 }}>Puntuación Final: <strong>{score}</strong></p>
              <div style={{ display: 'flex', gap: '10px', justifyContent: 'center' }}>
                <button className="gold-btn" onClick={startGame}>Reintentar 🔄</button>
                <button className="primary-btn" onClick={() => onFinishScore && onFinishScore(score)}>Compartir Récord 📢</button>
              </div>
            </div>
          )}
        </div>
      );
    }

        const now = Date.now();
        if (now - lastTapRef.current < 300) {
          const rect = e.currentTarget.getBoundingClientRect();
          const heart = { id: Date.now(), x: e.clientX - rect.left, y: e.clientY - rect.top };

                  <div style={{ display: 'flex', gap: '12px', marginTop: '10px' }}>
                    {!cameraStream ? (
                      <button className="primary-btn" onClick={startCamera}>Encender Cámara 📷</button>
                    ) : (
                      <>
                        {!isRecording ? (
                          <button className="primary-btn" style={{ background: '#fe2c55' }} onClick={startRecording}>
                            🔴 Empezar Grabación
                          </button>
                        ) : (
                          <button className="primary-btn" style={{ background: '#25f4ee', color: '#000' }} onClick={stopRecording}>
                            ⏹ Detener y Publicar
                          </button>
                        )}
                        <button className="badge-btn" onClick={stopCamera}>Apagar</button>
                      </>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* AI Studio Modal */}
          {aiStudioModal && (
            <div className="drawer-backdrop" onClick={() => setAiStudioModal(false)}>
              <div className="drawer-content" onClick={e => e.stopPropagation()}>
                <div className="drawer-header">
                  <div>✨ TakTak AI Studio (MoneyPrinterTurbo)</div>
                  <button className="close-btn" onClick={() => setAiStudioModal(false)}>&times;</button>
                </div>
                <div className="modal-body">
                  <div className="form-group">
                    <label className="form-label">Idea o guión para el vídeo</label>
                    <textarea id="ai-prompt" className="form-textarea" rows="2" defaultValue="5 datos asombrosos sobre videojuegos y tecnología 🕹️⚡" />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Estilo Visual</label>
                    <select className="form-select">
                      <option>Cyberpunk & Neón ⚡</option>
                      <option>Cinemático 4K 🎬</option>
                      <option>Anime & Ilustrado 🎨</option>
                    </select>
                  </div>
                  <button
                    className="ai-gradient-btn"
                    onClick={() => {
                      const prompt = document.getElementById('ai-prompt').value;
                      handleUpload(`🤖 AI: "${prompt}"`, '#aivideo #moneyprinterturbo #ia');
                      setAiStudioModal(false);
                    }}
                  >
                    ⚡ Generar y Publicar con IA
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* User Profile Modal */}
          {profileModal && (
            <div className="drawer-backdrop" onClick={() => setProfileModal(false)}>
              <div className="drawer-content" onClick={e => e.stopPropagation()}>
                <div className="drawer-header">
                  <div>Perfil de Usuario</div>
                  <button className="close-btn" onClick={() => setProfileModal(false)}>&times;</button>
                </div>
                <div className="modal-body" style={{ textAlign: 'center' }}>
                  <img src={currentUser.avatar} style={{ width: '74px', height: '74px', borderRadius: '50%', margin: '0 auto', border: '3px solid #fe2c55', objectFit: 'cover' }} />
                  <h3 style={{ marginTop: '8px', fontSize: '18px' }}>{currentUser.name}</h3>
                  <div style={{ color: '#aaa', fontSize: '13px' }}>@{currentUser.username}</div>
                  <p style={{ color: '#eee', fontSize: '13.5px', marginTop: '6px' }}>{currentUser.bio}</p>

                  <div style={{ display: 'flex', justifyContent: 'center', gap: '24px', margin: '14px 0', borderTop: '1px solid rgba(255,255,255,0.1)', borderBottom: '1px solid rgba(255,255,255,0.1)', padding: '12px 0' }}>
                    <div><strong>{currentUser.following}</strong><div style={{ fontSize: '11px', color: '#888' }}>Siguiendo</div></div>
                    <div><strong>{currentUser.followers}</strong><div style={{ fontSize: '11px', color: '#888' }}>Seguidores</div></div>
                    <div><strong>{currentUser.likesCount}</strong><div style={{ fontSize: '11px', color: '#888' }}>Me gusta</div></div>
                  </div>

                  <div style={{ display: 'flex', gap: '10px', justifyContent: 'center' }}>
                    <button className="badge-btn" onClick={() => {
                      const newBio = prompt('Nueva biografía:', currentUser.bio);
                      if (newBio) setCurrentUser({ ...currentUser, bio: newBio });
                    }}>
                      ✏️ Editar Bio
                    </button>
                    <button className="badge-btn" onClick={() => setAuthModal(true)}>
                      🔑 Cambiar Cuenta
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Auth Modal */}
          {authModal && (
            <div className="drawer-backdrop" onClick={() => setAuthModal(false)}>
              <div className="drawer-content" onClick={e => e.stopPropagation()}>
                <div className="drawer-header">
                  <div>Iniciar Sesión en TakTak</div>
                  <button className="close-btn" onClick={() => setAuthModal(false)}>&times;</button>
                </div>
                <div className="modal-body" style={{ gap: '12px' }}>
                  <button className="primary-btn" style={{ background: '#4285F4' }} onClick={() => {
                    setCurrentUser({
                      username: 'google_user',
                      name: 'Google User',
                      avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',
                      bio: 'Conectado mediante Google Auth 🔥',
                      followers: 4300,
                      following: 250,
                      likesCount: 18200
                    });
                    setAuthModal(false);
                    showToast('¡Sesión iniciada con Google!');
                  }}>
                    🌐 Continuar con Google
                  </button>

                  <button className="primary-btn" style={{ background: '#25D366' }} onClick={() => {
                    const phone = prompt('Introduce tu número de teléfono (+34...):');
                    if (phone) {
                      setCurrentUser({
                        username: `user_${phone.slice(-4)}`,
                        name: `Usuario ${phone.slice(-4)}`,
                        avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150',
                        bio: 'Verificado por teléfono 📱',
                        followers: 520,
                        following: 95,
                        likesCount: 2300
                      });
                      setAuthModal(false);
                      showToast('¡Sesión iniciada con Teléfono!');
                    }
                  }}>
                    📱 Continuar con Teléfono
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
