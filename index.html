<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TakTak 🎵 — Plataforma de Vídeos Cortos y Juegos</title>
  
  <!-- SEO & OpenGraph Meta Tags -->
  <meta name="description" content="TakTak: Plataforma de vídeos cortos, minijuegos y creación con IA con diseño neón fosforescente." />
  <meta name="keywords" content="taktak, video corto, juegos, reels, neon, react, web video, minijuegos, perfil" />
  <meta name="author" content="taktakmessenger" />
  <meta property="og:title" content="TakTak 🎵 — Vídeos Cortos y Juegos" />
  <meta property="og:description" content="Descubre vídeos, juega minijuegos y crea con los colores fosforescentes de TakTak." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://taktakmessenger.github.io" />
  <meta name="theme-color" content="#07070d" />
  <link rel="manifest" href="manifest.json" />

  <!-- Fonts: Outfit & Plus Jakarta Sans matching the TakTak logo typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- React & Babel CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      /* Palette based on the official TakTak phosphorescent logo */
      --taktak-pink: #ff2d8d;
      --taktak-pink-glow: rgba(255, 45, 141, 0.45);
      --taktak-purple: #b04bfb;
      --taktak-cyan: #00f7d4;
      --taktak-cyan-glow: rgba(0, 247, 212, 0.4);
      --taktak-gold: #ffd600;
      
      --gradient-taktak: linear-gradient(135deg, #ff2d8d 0%, #b04bfb 50%, #00f7d4 100%);
      --gradient-taktak-reverse: linear-gradient(135deg, #00f7d4 0%, #b04bfb 50%, #ff2d8d 100%);
      --gradient-btn-pink: linear-gradient(135deg, #ff2d8d 0%, #ff529f 100%);
      --gradient-btn-cyan: linear-gradient(135deg, #00f7d4 0%, #00d4b6 100%);

      --bg-main: #05050a;
      --bg-surface: #0e0e17;
      --bg-surface-elevated: #181826;
      --color-text-main: #ffffff;
      --color-text-muted: #9e9eb4;
      
      --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-heading: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      
      --shadow-glow: 0 0 30px var(--taktak-pink-glow), 0 0 20px var(--taktak-cyan-glow);
      --shadow-card: 0 15px 40px rgba(0, 0, 0, 0.85);
      --transition-fast: 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      background-color: var(--bg-main);
      color: var(--color-text-main);
      font-family: var(--font-family);
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #root {
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center top, #160d26 0%, #05050a 80%);
    }

    .app-viewport {
      width: 100%;
      height: 100%;
      max-width: 440px;
      background-color: #000000;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-card);
    }

    @media (min-width: 500px) {
      .app-viewport {
        height: 92vh;
        border-radius: var(--radius-lg);
        border: 1px solid rgba(255, 45, 141, 0.25);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95), 0 0 40px rgba(255, 45, 141, 0.25), 0 0 25px rgba(0, 247, 212, 0.2);
      }
    }

    /* ================= CINEMATIC SPLASH OPENING ANIMATION ================= */
    .splash-opening-overlay {
      position: absolute;
      inset: 0;
      z-index: 300;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: splashCinematic 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: none;
    }

    .splash-opening-logo {
      width: 170px;
      height: 170px;
      border-radius: 38px;
      object-fit: cover;
      box-shadow: 0 0 60px var(--taktak-pink-glow), 0 0 35px var(--taktak-cyan-glow);
      animation: logoPulseGrow 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes splashCinematic {
      0% { opacity: 1; transform: scale(1); }
      70% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0; transform: scale(1.6); visibility: hidden; }
    }

    @keyframes logoPulseGrow {
      0% { transform: scale(0.8); opacity: 0; filter: drop-shadow(0 0 0 transparent); }
      35% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 30px var(--taktak-cyan)); }
      65% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* ================= COVER / PORTADA SPLASH SCREEN ================= */
    .cover-landing-screen {
      position: absolute;
      inset: 0;
      z-index: 200;
      background: radial-gradient(circle at center 20%, #1f0b2a 0%, #070710 65%, #000000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 34px 24px 38px;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    .cover-hero-glow {
      position: relative;
      margin-top: 15px;
    }

    .cover-hero-glow::before {
      content: '';
      position: absolute;
      inset: -15px;
      background: var(--gradient-taktak);
      border-radius: 46px;
      filter: blur(28px);
      opacity: 0.65;
      z-index: 0;
      animation: glowBreathing 3s ease-in-out infinite alternate;
    }

    @keyframes glowBreathing {
      0% { opacity: 0.45; filter: blur(22px); transform: scale(0.96); }
      100% { opacity: 0.85; filter: blur(34px); transform: scale(1.04); }
    }

    .cover-logo-img {
      width: 160px;
      height: 160px;
      border-radius: 36px;
      object-fit: cover;
      position: relative;
      z-index: 1;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .cover-title {
      font-family: var(--font-heading);
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-top: 18px;
      background: var(--gradient-taktak);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px var(--taktak-pink-glow));
    }

    .cover-subtitle {
      font-size: 14.5px;
      color: var(--color-text-muted);
      margin-top: 8px;
      line-height: 1.45;
      max-width: 320px;
      font-weight: 500;
    }

    .cover-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
      margin-top: 24px;
    }

    .auth-provider-btn {
      width: 100%;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-family: var(--font-heading);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      border: none;
      transition: transform var(--transition-fast), filter var(--transition-fast), box-shadow var(--transition-fast);
    }

    .auth-provider-btn:active {
      transform: scale(0.97);
    }

    .auth-provider-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .btn-google {
      background: #ffffff;
      color: #070710;
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
    }

    .btn-phone {
      background: var(--gradient-btn-cyan);
      color: #051412;
      box-shadow: 0 6px 20px var(--taktak-cyan-glow);
    }

    .btn-guest {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
    }

    /* Feed Container */
    .feed-container {
      flex: 1;
      height: 100%;
      width: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      position: relative;
    }

    .feed-container::-webkit-scrollbar {
      display: none;
    }

    .video-slide {
      height: 100%;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #050505;
      overflow: hidden;
    }

    .video-player-element {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-overlay-gradient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.55) 0%,
        transparent 18%,
        transparent 55%,
        rgba(5, 5, 10, 0.9) 95%
      );
      z-index: 2;
    }

    /* Top Navigation Header */
    .top-header-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(to bottom, rgba(5, 5, 10, 0.88) 0%, transparent 100%);
    }

    .brand-logo {
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 22px;
      letter-spacing: -0.5px;
      background: var(--gradient-taktak);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      filter: drop-shadow(0 0 10px var(--taktak-pink-glow));
    }

    .brand-logo-icon {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--taktak-cyan);
      box-shadow: 0 0 10px var(--taktak-cyan-glow);
    }

    .header-tabs {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .header-tab-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-family: var(--font-heading);
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      position: relative;
      transition: var(--transition-fast);
      padding: 4px 0;
    }

    .header-tab-btn.active {
      color: #ffffff;
      font-size: 15.5px;
    }

    .header-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gradient-taktak);
      border-radius: var(--radius-full);
      box-shadow: 0 0 12px var(--taktak-pink);
    }

    .header-tab-btn.game-tab.active::after {
      background: linear-gradient(135deg, var(--taktak-gold) 0%, var(--taktak-cyan) 100%);
      box-shadow: 0 0 12px var(--taktak-cyan);
    }

    .header-right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-btn {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 247, 212, 0.35);
      color: var(--taktak-cyan);
      border-radius: 18px;
      padding: 5px 12px;
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 0 10px rgba(0, 247, 212, 0.2);
      transition: transform var(--transition-fast), background var(--transition-fast);
    }

    .badge-btn:hover {
      transform: scale(1.05);
      background: rgba(0, 247, 212, 0.2);
    }

    /* Right Action Sidebar */
    .action-sidebar {
      position: absolute;
      right: 12px;
      bottom: 82px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .action-btn-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      transition: transform var(--transition-fast);
    }

    .action-btn-item:active {
      transform: scale(0.85);
    }

    .action-icon-circle {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(14, 14, 23, 0.7);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: var(--transition-fast);
    }

    .action-icon-circle.liked {
      color: var(--taktak-pink);
      border-color: rgba(255, 45, 141, 0.6);
      background: rgba(255, 45, 141, 0.25);
      box-shadow: 0 0 18px var(--taktak-pink-glow);
      animation: heartPulse 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .action-label {
      font-size: 11.5px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
    }

    .creator-avatar-container {
      position: relative;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .creator-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--taktak-cyan);
      box-shadow: 0 0 12px var(--taktak-cyan-glow);
      object-fit: cover;
    }

    .follow-badge-plus {
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 19px;
      height: 19px;
      background: var(--gradient-btn-pink);
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 2px 8px var(--taktak-pink-glow);
    }

    .vinyl-sound-disc {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #0d0d16;
      border: 3px solid #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: spinVinyl 5s linear infinite;
      box-shadow: 0 0 12px rgba(0, 247, 212, 0.3);
    }

    .vinyl-sound-disc img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
    }

    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Video Meta Info */
    .video-meta-info {
      position: absolute;
      left: 14px;
      right: 74px;
      bottom: 74px;
      z-index: 9;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
    }

    .creator-username {
      font-size: 16px;
      font-family: var(--font-heading);
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .verified-check {
      background: var(--taktak-cyan);
      color: #000;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 900;
    }

    .video-description {
      font-size: 13.5px;
      line-height: 1.4;
      color: #f5f5f5;
    }

    .video-tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-badge {
      color: var(--taktak-cyan);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity var(--transition-fast);
      text-shadow: 0 0 8px var(--taktak-cyan-glow);
    }

    .tag-badge:hover {
      opacity: 0.85;
      text-decoration: underline;
    }

    .sound-marquee-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #ffffff;
      opacity: 0.95;
    }

    /* Floating Heart Effect */
    .floating-heart {
      position: absolute;
      pointer-events: none;
      font-size: 75px;
      transform: translate(-50%, -50%) scale(0);
      animation: burstHeart 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 25;
      filter: drop-shadow(0 0 22px var(--taktak-pink));
    }

    @keyframes burstHeart {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 1; }
      40% { transform: translate(-50%, -50%) scale(1.35) rotate(8deg); opacity: 1; }
      100% { transform: translate(-50%, -120px) scale(0.9) rotate(-8deg); opacity: 0; }
    }

    @keyframes heartPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    /* Bottom Navigation Bar */
    .bottom-nav-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 62px;
      background: rgba(5, 5, 10, 0.95);
      backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255, 255, 255, 0.09);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 30;
    }

    .nav-item-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--color-text-muted);
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-fast);
      min-width: 48px;
    }

    .nav-item-btn.active {
      color: var(--taktak-cyan);
      text-shadow: 0 0 8px var(--taktak-cyan-glow);
    }

    .nav-create-btn {
      background: var(--gradient-taktak);
      border: none;
      width: 48px;
      height: 33px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #05050a;
      font-weight: 900;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 0 20px var(--taktak-pink-glow);
      transition: transform var(--transition-fast);
    }

    .nav-create-btn:hover {
      transform: scale(1.08);
    }

    /* Drawers & Modals */
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(14px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      animation: fadeIn 0.2s ease-out;
    }

    .drawer-content {
      background: #0f0f1c;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border-top: 1px solid rgba(255, 45, 141, 0.3);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 45, 141, 0.15);
      max-height: 88%;
      min-height: 52%;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      padding-bottom: 18px;
      overflow: hidden;
    }

    .drawer-header {
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 800;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--color-text-muted);
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover {
      color: var(--taktak-cyan);
    }

    .modal-body {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12.5px;
      font-weight: 700;
      color: #ccc;
    }

    .form-input, .form-textarea, .form-select {
      background: #181829;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--taktak-pink);
      box-shadow: 0 0 15px var(--taktak-pink-glow);
    }

    .primary-btn {
      background: var(--gradient-btn-pink);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 13px 18px;
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 4px 18px var(--taktak-pink-glow);
      transition: transform var(--transition-fast), filter var(--transition-fast);
    }

    .primary-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .ai-gradient-btn {
      background: var(--gradient-taktak);
      color: #05050a;
      border: none;
      border-radius: var(--radius-md);
      padding: 13px 18px;

    const { useState, useEffect, useRef } = React;

    const INITIAL_VIDEOS = [

        ]
      }

    function BeatRunnerGame({ onFinishScore }) {
      const [score, setScore] = useState(0);
      const [gameOver, setGameOver] = useState(false);
      const [playerPos, setPlayerPos] = useState(50);
      const [obstacle, setObstacle] = useState({ x: 50, y: 0 });
      const [isPlaying, setIsPlaying] = useState(false);

      useEffect(() => {
        if (!isPlaying || gameOver) return;
        const interval = setInterval(() => {
          setObstacle(obs => {
            if (obs.y >= 90) {
              if (Math.abs(obs.x - playerPos) < 25) {
                setGameOver(true);
                return obs;
              }
              setScore(s => s + 10);
              return { x: Math.floor(Math.random() * 80) + 10, y: 0 };
            }
            return { ...obs, y: obs.y + 4 };
          });
        }, 50);
        return () => clearInterval(interval);
      }, [isPlaying, gameOver, playerPos]);

      const startGame = () => {
        setScore(0);
        setGameOver(false);
        setObstacle({ x: 50, y: 0 });
        setIsPlaying(true);
      };

      return (
        <div style={{ width: '100%', height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
          <div style={{ position: 'absolute', top: 15, left: 20, fontSize: '18px', fontWeight: '900', color: 'var(--taktak-gold)' }}>
            🏆 Puntos: {score}
          </div>

          {!isPlaying && !gameOver && (
            <div style={{ textAlign: 'center', padding: 20 }}>
              <div style={{ fontSize: '46px', marginBottom: 10 }}>🎮</div>
              <h2 style={{ color: '#fff', fontFamily: 'var(--font-heading)', fontSize: '22px', marginBottom: 8, background: 'var(--gradient-taktak)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>TakTak Beat Runner</h2>
              <p style={{ color: '#aaa', fontSize: '13.5px', marginBottom: 20 }}>Desliza o toca izquierda/derecha para esquivar las notas musicales neón.</p>
              <button className="gold-btn" onClick={startGame}>⚡ Iniciar Juego</button>
            </div>
          )}

          {isPlaying && !gameOver && (
            <div style={{ width: '100%', height: '100%', position: 'relative', overflow: 'hidden' }}>
              <div style={{
                position: 'absolute',
                top: `${obstacle.y}%`,
                left: `${obstacle.x}%`,
                transform: 'translate(-50%, -50%)',
                fontSize: '30px',
                filter: 'drop-shadow(0 0 10px var(--taktak-pink))'
              }}>
                🎵
              </div>

              <div style={{
                position: 'absolute',
                bottom: '15%',
                left: `${playerPos}%`,
                transform: 'translate(-50%, 0)',
                width: '46px',
                height: '46px',
                borderRadius: '50%',
                background: 'var(--gradient-taktak)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                fontSize: '24px',
                boxShadow: '0 0 20px var(--taktak-cyan)',
                transition: 'left 0.1s ease'
              }}>
                🚀
              </div>

              <div style={{ position: 'absolute', bottom: 10, width: '100%', display: 'flex', justifyContent: 'space-between', padding: '0 20px' }}>
                <button
                  style={{ background: 'rgba(255,255,255,0.15)', border: '1px solid var(--taktak-cyan)', color: '#fff', padding: '14px 28px', borderRadius: '14px', fontSize: '18px', fontWeight: 'bold' }}
                  onClick={() => setPlayerPos(p => Math.max(15, p - 20))}
                >
                  ◀ Izq
                </button>
                <button
                  style={{ background: 'rgba(255,255,255,0.15)', border: '1px solid var(--taktak-pink)', color: '#fff', padding: '14px 28px', borderRadius: '14px', fontSize: '18px', fontWeight: 'bold' }}
                  onClick={() => setPlayerPos(p => Math.min(85, p + 20))}
                >
                  Der ▶
                </button>
              </div>
            </div>
          )}

          {gameOver && (
            <div style={{ textAlign: 'center', padding: 20 }}>
              <div style={{ fontSize: '46px', marginBottom: 8 }}>💥</div>
              <h2 style={{ color: 'var(--taktak-pink)', fontSize: '24px', fontFamily: 'var(--font-heading)', fontWeight: '900', marginBottom: 6 }}>¡Juego Terminado!</h2>
              <p style={{ color: '#fff', fontSize: '16px', marginBottom: 18 }}>Puntuación Final: <strong style={{ color: 'var(--taktak-cyan)' }}>{score}</strong></p>
              <div style={{ display: 'flex', gap: '10px', justifyContent: 'center' }}>
                <button className="gold-btn" onClick={startGame}>Reintentar 🔄</button>
                <button className="primary-btn" onClick={() => onFinishScore && onFinishScore(score)}>Compartir Récord 📢</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('taktak_user');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return {
          id: 'user_local',
          username: 'creador_taktak',
          name: 'Mi Perfil TakTak',
          avatar: 'copilot_image_1758359058839.jpeg',
          bio: 'Creando contenido y jugando en TakTak 🚀✨',
          followers: 1240,
          following: 180,
          likesCount: 5400,
          provider: 'local',
          isLoggedIn: false
        };
      });

      const [showCoverScreen, setShowCoverScreen] = useState(() => {
        return !localStorage.getItem('taktak_cover_seen');
      });

      // Opening Cinematic Splash state (like TikTok logo animation)
      const [isOpeningAnimation, setIsOpeningAnimation] = useState(false);

      const [videos, setVideos] = useState(INITIAL_VIDEOS);
      const [activeIndex, setActiveIndex] = useState(0);
      const [isMuted, setIsMuted] = useState(true);
      const [activeTab, setActiveTab] = useState('foryou');
      const [activeNav, setActiveNav] = useState('home');
      const [searchQuery, setSearchQuery] = useState('');
      const [profileSubTab, setProfileSubTab] = useState('videos');
      
      const [commentsModal, setCommentsModal] = useState(null);
      const [shareModal, setShareModal] = useState(null);
      const [uploadModal, setUploadModal] = useState(false);
      const [cameraModal, setCameraModal] = useState(false);
      const [aiStudioModal, setAiStudioModal] = useState(false);
      const [profileModal, setProfileModal] = useState(false);
      const [editProfileModal, setEditProfileModal] = useState(false);
      const [authModal, setAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('select');
      const [toastMsg, setToastMsg] = useState('');

      const [editName, setEditName] = useState(currentUser.name);
      const [editUsername, setEditUsername] = useState(currentUser.username);
      const [editBio, setEditBio] = useState(currentUser.bio);
      const [editAvatarUrl, setEditAvatarUrl] = useState(currentUser.avatar);

      const [googleNameInput, setGoogleNameInput] = useState('');
      const [googleEmailInput, setGoogleEmailInput] = useState('');
      const [phoneInput, setPhoneInput] = useState('');
      const [phoneCodeInput, setPhoneCodeInput] = useState('');
      const [phoneNameInput, setPhoneNameInput] = useState('');
      const [phoneStep, setPhoneStep] = useState(1);

      const [cameraStream, setCameraStream] = useState(null);
      const [isRecording, setIsRecording] = useState(false);
      const videoCamRef = useRef(null);
      const mediaRecorderRef = useRef(null);

      const avatarFileInputRef = useRef(null);
      const editAvatarFileInputRef = useRef(null);
      const googleAvatarFileInputRef = useRef(null);
      const phoneAvatarFileInputRef = useRef(null);

      const [newComment, setNewComment] = useState('');
      const [hearts, setHearts] = useState([]);
      const containerRef = useRef(null);
      const lastTapRef = useRef(0);

      const triggerOpeningAnimation = (callback) => {
        setIsOpeningAnimation(true);
        setTimeout(() => {
          setIsOpeningAnimation(false);
          if (callback) callback();
        }, 1300);
      };

      const updateUserProfile = (updated) => {
        const fullUser = { ...currentUser, ...updated, isLoggedIn: true };
        setCurrentUser(fullUser);
        try {
          localStorage.setItem('taktak_user', JSON.stringify(fullUser));
          localStorage.setItem('taktak_cover_seen', 'true');
        } catch (e) {}
      };

      const dismissCover = () => {
        triggerOpeningAnimation(() => {
          setShowCoverScreen(false);
          try {
            localStorage.setItem('taktak_cover_seen', 'true');
          } catch (e) {}
        });
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2600);
      };

      const displayedVideos = videos.filter(v => {
        if (searchQuery) {
          return v.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                 v.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));
        }
        if (activeTab === 'following') return v.category === 'following';
        return true;
      });

      useEffect(() => {
        const c = containerRef.current;
        if (!c) return;
        const onScroll = () => {
          const idx = Math.round(c.scrollTop / c.clientHeight);
          if (idx !== activeIndex && idx >= 0 && idx < displayedVideos.length) {
            setActiveIndex(idx);
          }
        };
        c.addEventListener('scroll', onScroll, { passive: true });
        return () => c.removeEventListener('scroll', onScroll);
      }, [activeIndex, displayedVideos.length]);

      const handleLike = (id) => {
        setVideos(prev => prev.map(v => {
          if (v.id === id) {
            const nextLiked = !v.liked;
            return {
              ...v,
              liked: nextLiked,
              likes: nextLiked ? v.likes + 1 : Math.max(0, v.likes - 1)
            };
          }
          return v;
        }));
      };

      const handleDoubleTap = (e, id) => {
        const now = Date.now();
        if (now - lastTapRef.current < 300) {
          const rect = e.currentTarget.getBoundingClientRect();
          const heart = { id: Date.now(), x: e.clientX - rect.left, y: e.clientY - rect.top };
          setHearts(h => [...h, heart]);
          setTimeout(() => setHearts(h => h.filter(x => x.id !== heart.id)), 850);
          handleLike(id);
          lastTapRef.current = 0;
        } else {
          lastTapRef.current = now;
        }
      };

      const handleAddComment = (e) => {
        e.preventDefault();
        if (!newComment.trim() || !commentsModal) return;
        const c = {
          id: Date.now(),
          username: currentUser.username,
          avatar: currentUser.avatar,
          text: newComment.trim()
        };
        setVideos(prev => prev.map(v => v.id === commentsModal.id ? { ...v, comments: [c, ...v.comments] } : v));
        setCommentsModal(prev => ({ ...prev, comments: [c, ...prev.comments] }));
        setNewComment('');
        showToast('¡Comentario publicado!');
      };

      const handleUpload = (title, tags, customVideoUrl) => {
        const sampleVideos = [
          'https://assets.mixkit.co/videos/preview/mixkit-young-woman-skater-performing-a-trick-41129-large.mp4',
          'https://assets.mixkit.co/videos/preview/mixkit-man-working-on-his-laptop-308-large.mp4',
          'https://assets.mixkit.co/videos/preview/mixkit-futuristic-robot-with-artificial-intelligence-50796-large.mp4'
        ];
        const newV = {
          id: Date.now(),
          userId: currentUser.username,
          user: currentUser,
          title: title || 'Nuevo clip publicado en TakTak 🚀',
          tags: tags ? (Array.isArray(tags) ? tags : tags.split(' ')) : ['#taktak', '#viral'],
          soundTitle: `${currentUser.name} — Sonido original`,
          soundAvatar: currentUser.avatar,
          videoUrl: customVideoUrl || sampleVideos[Math.floor(Math.random() * sampleVideos.length)],
          likes: 1,
          liked: true,
          shares: 0,
          category: 'foryou',
          comments: []
        };
        setVideos([newV, ...videos]);
        setUploadModal(false);
        setCameraModal(false);
        setActiveTab('foryou');
        setActiveIndex(0);
        showToast('¡Vídeo publicado con éxito! 🎉');
      };

      const handleAvatarFilePicked = (e, callback) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const base64Url = event.target.result;
            if (callback) {
              callback(base64Url);
            } else {
              updateUserProfile({ avatar: base64Url });
              showToast('¡Foto de perfil actualizada! 📸');
            }
          };
          reader.readAsDataURL(file);
        }
      };

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          setCameraStream(stream);
          if (videoCamRef.current) {
            videoCamRef.current.srcObject = stream;
          }
        } catch (err) {
          console.warn(err);
          showToast('Cámara iniciada');
        }
      };

      const stopCamera = () => {
        if (cameraStream) {
          cameraStream.getTracks().forEach(t => t.stop());
          setCameraStream(null);
        }
      };

      const startRecording = () => {
        setIsRecording(true);
        if (cameraStream) {
          const chunks = [];
          const recorder = new MediaRecorder(cameraStream);
          recorder.ondataavailable = e => chunks.push(e.data);
          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/mp4' });
            const videoBlobUrl = URL.createObjectURL(blob);
            handleUpload(`🎥 Clip grabado con cámara (${new Date().toLocaleTimeString()})`, '#camara #taktak #live', videoBlobUrl);
            stopCamera();
          };
          recorder.start();
          mediaRecorderRef.current = recorder;
        }
      };

      const stopRecording = () => {
        setIsRecording(false);
        if (mediaRecorderRef.current) {
          mediaRecorderRef.current.stop();
        }
      };

      const myUploadedVideos = videos.filter(v => v.userId === currentUser.username || v.user?.username === currentUser.username);
      const myLikedVideos = videos.filter(v => v.liked);

      return (
        <div className="app-viewport">
          {toastMsg && <div className="toast-popup">✨ {toastMsg}</div>}

          {/* Hidden Global Avatar Picker */}
          <input
            type="file"
            accept="image/*"
            ref={avatarFileInputRef}
            style={{ display: 'none' }}
            onChange={(e) => handleAvatarFilePicked(e)}
          />

          {/* ================= OPENING CINEMATIC SPLASH ANIMATION ================= */}
          {isOpeningAnimation && (
            <div className="splash-opening-overlay">
              <img
                src="copilot_image_1758359058839.jpeg"
                onError={e => e.target.src='taktak_cover.jpeg'}
                className="splash-opening-logo"
                alt="TakTak"
              />
            </div>
          )}

          {/* ================= COVER / PORTADA SPLASH SCREEN ================= */}
          {showCoverScreen && (
            <div className="cover-landing-screen">
              <div>
                <div className="cover-hero-glow">
                  <img
                    src="copilot_image_1758359058839.jpeg"

                      className="form-textarea"
                      rows="2"
                      value={editBio}
                      onChange={e => setEditBio(e.target.value)}
                      placeholder="Describe lo que haces..."
                    />
                  </div>

                  <button
                    className="primary-btn"
                    onClick={() => {
                      if (!editName.trim() || !editUsername.trim()) {
                        alert('Por favor ingresa nombre y nombre de usuario');
                        return;
                      }
                      updateUserProfile({
                        name: editName.trim(),
                        username: editUsername.trim(),
                        bio: editBio.trim(),
                        avatar: editAvatarUrl
                      });
                      setEditProfileModal(false);
                      showToast('¡Perfil guardado correctamente! ✅');
                    }}
                  >
                    💾 Guardar Cambios
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* AUTH MODAL (Google & Phone Registration) */}
          {authModal && (
            <div className="drawer-backdrop" onClick={() => setAuthModal(false)}>
              <div className="drawer-content" style={{ minHeight: '65%' }} onClick={e => e.stopPropagation()}>
                <div className="drawer-header">
                  <div>
                    {authMode === 'select' && 'Crear Cuenta o Iniciar Sesión'}
                    {authMode === 'google' && 'Crear cuenta con Google 🌐'}
                    {authMode === 'phone' && 'Iniciar con Teléfono 📱'}
                  </div>
                  <button className="close-btn" onClick={() => setAuthModal(false)}>&times;</button>
                </div>
                
                <div className="modal-body">
                  {authMode === 'select' && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                      <button
                        className="auth-provider-btn btn-google"
                        onClick={() => {
                          setGoogleNameInput(currentUser.name !== 'Mi Perfil TakTak' ? currentUser.name : '');
                          setAuthMode('google');
                        }}
                      >
                        <svg width="20" height="20" viewBox="0 0 24 24">
                          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        Continuar con Google
                      </button>

                      <button
                        className="auth-provider-btn btn-phone"
                        onClick={() => {
                          setPhoneStep(1);
                          setAuthMode('phone');
                        }}
                      >
                        <span>📱</span>
                        Continuar con Teléfono
                      </button>
                    </div>
                  )}

                  {authMode === 'google' && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                      <p style={{ fontSize: '13px', color: '#bbb' }}>Ingresa tus datos reales de Google para sincronizar tu cuenta:</p>
                      
                      <div className="form-group">
                        <label className="form-label">Nombre de tu cuenta de Google</label>
                        <input
                          type="text"
                          className="form-input"
                          placeholder="Ej. Juan Pérez"
                          value={googleNameInput}
                          onChange={e => setGoogleNameInput(e.target.value)}
                        />
                      </div>

                      <div className="form-group">
                        <label className="form-label">Correo Electrónico (Gmail)</label>
                        <input
                          type="email"
                          className="form-input"
                          placeholder="tu.correo@gmail.com"
                          value={googleEmailInput}
                          onChange={e => setGoogleEmailInput(e.target.value)}
                        />
                      </div>

                      <input
                        type="file"
                        accept="image/*"
                        ref={googleAvatarFileInputRef}
                        style={{ display: 'none' }}
                        onChange={(e) => handleAvatarFilePicked(e, (url) => setEditAvatarUrl(url))}
                      />

                      <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                        <img src={editAvatarUrl} onError={e => e.target.src='copilot_image_1758359058839.jpeg'} style={{ width: '44px', height: '44px', borderRadius: '50%', objectFit: 'cover', border: '1px solid var(--taktak-cyan)' }} />
                        <button
                          type="button"
                          className="badge-btn"
                          onClick={() => googleAvatarFileInputRef.current?.click()}
                        >
                          📷 Subir Foto de Perfil
                        </button>
                      </div>

                      <div style={{ display: 'flex', gap: '10px', marginTop: '10px' }}>
                        <button className="badge-btn" onClick={() => setAuthMode('select')}>Atrás</button>
                        <button
                          className="primary-btn"
                          style={{ flex: 1 }}
                          onClick={() => {
                            const name = googleNameInput.trim() || 'Usuario Google';
                            const username = (googleEmailInput.split('@')[0] || name).toLowerCase().replace(/[^a-z0-9_]/g, '_');
                            updateUserProfile({
                              name: name,
                              username: username,
                              email: googleEmailInput,
                              avatar: editAvatarUrl,
                              bio: `Conectado con Google (${googleEmailInput || 'Gmail'}) ✨`,
                              provider: 'google'
                            });
                            setAuthModal(false);
                            dismissCover();
                            showToast(`¡Bienvenido ${name}! Conectado con Google.`);
                          }}
                        >
                          Conectar y Entrar 🚀
                        </button>
                      </div>
                    </div>
                  )}

                  {authMode === 'phone' && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                      {phoneStep === 1 && (
                        <>
                          <p style={{ fontSize: '13px', color: '#bbb' }}>Ingresa tu número de teléfono para recibir un código de acceso:</p>
                          <div className="form-group">
                            <label className="form-label">Número de Teléfono</label>
                            <input
                              type="tel"
                              className="form-input"
                              placeholder="+34 600 000 000"
                              value={phoneInput}
                              onChange={e => setPhoneInput(e.target.value)}
                            />
                          </div>

                          <div style={{ display: 'flex', gap: '10px', marginTop: '8px' }}>
                            <button className="badge-btn" onClick={() => setAuthMode('select')}>Atrás</button>
                            <button
                              className="primary-btn"
                              style={{ flex: 1, background: 'var(--gradient-btn-cyan)', color: '#000' }}
                              onClick={() => {
                                if (!phoneInput.trim()) {
                                  alert('Por favor ingresa tu número de teléfono');
                                  return;
                                }
                                setPhoneStep(2);
                                showToast('Código SMS enviado: 123456');
                              }}
                            >
                              Enviar Código SMS 📲
                            </button>
                          </div>
                        </>
                      )}

                      {phoneStep === 2 && (
                        <>
                          <p style={{ fontSize: '13px', color: '#bbb' }}>Ingresa el código de 6 dígitos enviado a {phoneInput}:</p>
                          <div className="form-group">
                            <label className="form-label">Código de Verificación (SMS)</label>
                            <input
                              type="text"
                              className="form-input"
                              placeholder="123456"
                              maxLength="6"
                              value={phoneCodeInput}
                              onChange={e => setPhoneCodeInput(e.target.value)}
                            />
                          </div>

                          <div className="form-group">
                            <label className="form-label">Tu Nombre</label>
                            <input
                              type="text"
                              className="form-input"
                              placeholder="Nombre para mostrar"
                              value={phoneNameInput}
                              onChange={e => setPhoneNameInput(e.target.value)}
                            />
                          </div>

                          <input
                            type="file"
                            accept="image/*"
                            ref={phoneAvatarFileInputRef}
                            style={{ display: 'none' }}
                            onChange={(e) => handleAvatarFilePicked(e, (url) => setEditAvatarUrl(url))}
                          />

                          <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                            <img src={editAvatarUrl} onError={e => e.target.src='copilot_image_1758359058839.jpeg'} style={{ width: '44px', height: '44px', borderRadius: '50%', objectFit: 'cover', border: '1px solid var(--taktak-pink)' }} />
                            <button
                              type="button"
                              className="badge-btn"
                              onClick={() => phoneAvatarFileInputRef.current?.click()}
                            >
                              📷 Subir Foto
                            </button>
                          </div>

                          <div style={{ display: 'flex', gap: '10px', marginTop: '8px' }}>
                            <button className="badge-btn" onClick={() => setPhoneStep(1)}>Atrás</button>
                            <button
                              className="primary-btn"
                              style={{ flex: 1, background: 'var(--gradient-btn-cyan)', color: '#000' }}
                              onClick={() => {
                                const name = phoneNameInput.trim() || `Usuario ${phoneInput.slice(-4)}`;
                                const username = `user_${phoneInput.slice(-4)}`;
                                updateUserProfile({
                                  name: name,
                                  username: username,
                                  phone: phoneInput,
                                  avatar: editAvatarUrl,
                                  bio: `Verificado con teléfono (${phoneInput}) 📱`,
                                  provider: 'phone'
                                });
                                setAuthModal(false);
                                dismissCover();
                                showToast(`¡Sesión iniciada con éxito! Bienvenido ${name}`);
                              }}
                            >
                              Verificar y Entrar ✅
                            </button>
                          </div>
                        </>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
