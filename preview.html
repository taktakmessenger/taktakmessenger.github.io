<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TakTak 🎵 — Vídeo Corto (Demo)</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- React & Babel CDNs for instant Zero-Build Preview in Chrome -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-main: #000000;
      --bg-surface: #121212;
      --color-primary: #fe2c55;
      --color-primary-hover: #e02449;
      --color-accent: #25f4ee;
      --color-text-main: #ffffff;
      --color-text-muted: #a0a0a0;
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
      --font-heading: 'Outfit', 'Inter', sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-full: 9999px;
      --shadow-glow: 0 0 25px rgba(254, 44, 85, 0.35);
      --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.6);
      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      background-color: var(--bg-main);
      color: var(--color-text-main);
      font-family: var(--font-family);
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #root {
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center top, #181829 0%, #000000 75%);
    }

    /* Container responsive */
    .app-viewport {
      width: 100%;
      height: 100%;
      max-width: 440px;
      background-color: #000000;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-card);
    }

    @media (min-width: 500px) {
      .app-viewport {
        height: 92vh;
        border-radius: var(--radius-lg);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(254, 44, 85, 0.25);
      }
    }

    /* Feed Container */
    .feed-container {
      flex: 1;
      height: 100%;
      width: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      position: relative;
    }

    .feed-container::-webkit-scrollbar {
      display: none;
    }

    /* Video Card Slide */
    .video-slide {
      height: 100%;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #050505;
      overflow: hidden;
    }

    .video-player-element {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-overlay-gradient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.45) 0%,
        transparent 20%,
        transparent 60%,
        rgba(0, 0, 0, 0.85) 95%
      );
      z-index: 2;
    }

    /* Top Header Bar */
    .top-header-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75) 0%, transparent 100%);
    }

    .header-tabs {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .header-tab-btn {
      background: none;
      border: none;
      color: var(--color-text-muted);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      transition: var(--transition-fast);
      padding: 4px 0;
    }

    .header-tab-btn.active {
      color: #ffffff;
      font-size: 16px;
    }

    .header-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 15%;
      right: 15%;
      height: 3px;
      background-color: var(--color-primary);
      border-radius: var(--radius-full);
    }

    .brand-logo {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, var(--color-accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Right Action Sidebar */
    .action-sidebar {
      position: absolute;
      right: 12px;
      bottom: 86px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .action-btn-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      transition: transform var(--transition-fast);
    }

    .action-btn-item:active {
      transform: scale(0.85);
    }

    .action-icon-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(30, 30, 30, 0.65);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      transition: var(--transition-fast);
    }

    .action-icon-circle.liked {
      color: var(--color-primary);
      animation: heartPulse 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .action-label {
      font-size: 11px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .creator-avatar-container {
      position: relative;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .creator-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      object-fit: cover;
    }

    .follow-badge-plus {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 18px;
      background-color: var(--color-primary);
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
    }

    .vinyl-sound-disc {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #111;
      border: 4px solid #222;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: spinVinyl 5s linear infinite;
    }

    .vinyl-sound-disc img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
    }

    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Video Metadata */
    .video-meta-info {
      position: absolute;
      left: 14px;
      right: 70px;
      bottom: 76px;
      z-index: 9;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.9);
    }

    .creator-username {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .verified-check {
      background: var(--color-accent);
      color: #000;
      border-radius: 50%;
      width: 13px;
      height: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 900;
    }

    .video-description {
      font-size: 13.5px;
      line-height: 1.35;
      color: #f0f0f0;
    }

    .video-tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag-badge {
      color: var(--color-accent);
      font-weight: 600;
      font-size: 12.5px;
    }

    .sound-marquee-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #ffffff;
      opacity: 0.9;
    }

    /* Floating Hearts */
    .floating-heart {
      position: absolute;
      pointer-events: none;
      font-size: 70px;
      transform: translate(-50%, -50%) scale(0);
      animation: burstHeart 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 20;
      filter: drop-shadow(0 0 15px rgba(254, 44, 85, 0.8));
    }

    @keyframes burstHeart {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0.9; }
      50% { transform: translate(-50%, -50%) scale(1.3) rotate(5deg); opacity: 1; }
      100% { transform: translate(-50%, -100px) scale(1) rotate(-5deg); opacity: 0; }
    }

    @keyframes heartPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }

    /* Bottom Navigation */
    .bottom-nav-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 30;
    }

    .nav-item-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--color-text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
      min-width: 50px;
    }

    .nav-item-btn.active {
      color: #ffffff;
    }

    .nav-create-btn {
      background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-primary) 100%);
      border: none;
      width: 44px;
      height: 30px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-size: 19px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(254, 44, 85, 0.4);
    }

    /* Drawers */
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      animation: fadeIn 0.2s ease-out;
    }

    .drawer-content {
      background: #141414;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      max-height: 80%;
      min-height: 45%;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      padding-bottom: 16px;
    }

    .drawer-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 15px;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--color-text-muted);
      font-size: 22px;
      cursor: pointer;
    }

    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #333;
    }

    .comment-user {
      font-size: 12px;
      font-weight: 700;
      color: #ddd;
    }

    .comment-text {
      font-size: 13.5px;
      color: #fff;
      margin-top: 1px;
    }

    .comment-input-area {
      padding: 10px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 8px;
    }

    .comment-input {
      flex: 1;
      background: #242424;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-full);
      padding: 8px 14px;
      color: #fff;
      font-size: 13.5px;
      outline: none;
    }

    .comment-send-btn {
      background: var(--color-primary);
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .modal-body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-label {
      font-size: 12.5px;
      font-weight: 600;
      color: #ccc;
    }

    .form-input, .form-textarea, .form-select {
      background: #222;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: #fff;
      font-size: 13.5px;
      outline: none;
    }

    .primary-btn {
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .ai-gradient-btn {
      background: linear-gradient(135deg, #fe2c55 0%, #a855f7 50%, #25f4ee 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_VIDEOS = [
      {
        id: 1,
        user: { username: 'elena_creadora', name: 'Elena Gómez', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150' },
        title: '¡Descubriendo nuevas vistas en la ciudad! 🌆✨ ¿Cuál es tu rincón favorito?',
        tags: ['#lifestyle', '#cityvibes', '#taktak', '#trend'],
        soundTitle: 'Elena Gómez — Original Urban Mix',
        soundAvatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',
        videoUrl: 'https://assets.mixkit.co/videos/preview/mixkit-young-woman-skater-performing-a-trick-41129-large.mp4',
        likes: 1420,
        liked: true,
        shares: 88,
        comments: [
          { id: 1, username: 'carlos_dev', text: '¡Increíble toma y fluidez! 🛹' },
          { id: 2, username: 'ana_dance', text: '¡Ese truco fue genial! 🔥' }
        ]
      },
      {
        id: 2,
        user: { username: 'carlos_dev', name: 'Carlos Tech', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150' },
        title: 'Animaciones fluidas en la nueva UI de TakTak 🚀 ¡Full responsive y 60 FPS!',
        tags: ['#coding', '#webdev', '#react', '#javascript'],
        soundTitle: 'Carlos Tech — Synthwave Coding Beats',
        soundAvatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150',
        videoUrl: 'https://assets.mixkit.co/videos/preview/mixkit-man-working-on-his-laptop-308-large.mp4',
        likes: 3840,
        liked: false,
        shares: 312,
        comments: [
          { id: 3, username: 'elena_creadora', text: '¡Qué buena interfaz oscura!' }
        ]
      },
      {
        id: 3,
        user: { username: 'ai_studio', name: 'TakTak AI Studio', avatar: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150' },
        title: '🤖 Vídeo generado automáticamente con IA mediante el adaptador MoneyPrinterTurbo',
        tags: ['#aivideo', '#moneyprinterturbo', '#generativeai'],
        soundTitle: 'Cybernetic Pulse — AI Soundscape V1',
        soundAvatar: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150',
        videoUrl: 'https://assets.mixkit.co/videos/preview/mixkit-futuristic-robot-with-artificial-intelligence-50796-large.mp4',
        likes: 8910,
        liked: false,
        shares: 1240,
        comments: [
          { id: 4, username: 'carlos_dev', text: '¡La síntesis de voz y el corte son instantáneos!' }
        ]
      }
    ];

    function App() {
      const [videos, setVideos] = useState(INITIAL_VIDEOS);
      const [activeIndex, setActiveIndex] = useState(0);
      const [isMuted, setIsMuted] = useState(true);
      const [commentsModal, setCommentsModal] = useState(null);
      const [shareModal, setShareModal] = useState(null);
      const [uploadModal, setUploadModal] = useState(false);
      const [aiStudioModal, setAiStudioModal] = useState(false);
      const [profileModal, setProfileModal] = useState(false);
      const [activeTab, setActiveTab] = useState('foryou');
      const [activeNav, setActiveNav] = useState('home');
      const [newComment, setNewComment] = useState('');
      const [hearts, setHearts] = useState([]);
      const containerRef = useRef(null);
      const lastTapRef = useRef(0);

      // Snap scroll observer
      useEffect(() => {
        const c = containerRef.current;
        if (!c) return;
        const onScroll = () => {
          const idx = Math.round(c.scrollTop / c.clientHeight);
          if (idx !== activeIndex && idx >= 0 && idx < videos.length) {
            setActiveIndex(idx);
          }
        };
        c.addEventListener('scroll', onScroll, { passive: true });
        return () => c.removeEventListener('scroll', onScroll);
      }, [activeIndex, videos.length]);

      const handleLike = (id) => {
        setVideos(prev => prev.map(v => {
          if (v.id === id) {
            const nextLiked = !v.liked;
            return {
              ...v,
              liked: nextLiked,
              likes: nextLiked ? v.likes + 1 : Math.max(0, v.likes - 1)
            };
          }
          return v;
        }));
      };

      const handleDoubleTap = (e, id) => {
        const now = Date.now();
        if (now - lastTapRef.current < 300) {
          const rect = e.currentTarget.getBoundingClientRect();
          const heart = { id: Date.now(), x: e.clientX - rect.left, y: e.clientY - rect.top };
          setHearts(h => [...h, heart]);
          setTimeout(() => setHearts(h => h.filter(x => x.id !== heart.id)), 800);
          handleLike(id);
          lastTapRef.current = 0;
        } else {
          lastTapRef.current = now;
        }
      };

      const handleAddComment = (e) => {
        e.preventDefault();
        if (!newComment.trim() || !commentsModal) return;
        const c = { id: Date.now(), username: 'tu_usuario', text: newComment.trim() };
        setVideos(prev => prev.map(v => v.id === commentsModal.id ? { ...v, comments: [c, ...v.comments] } : v));
        setCommentsModal(prev => ({ ...prev, comments: [c, ...prev.comments] }));
        setNewComment('');
      };

      const handleUpload = (title, tags) => {
        const sampleVideos = [
          'https://assets.mixkit.co/videos/preview/mixkit-hands-holding-a-smartphone-with-a-green-screen-40742-large.mp4',
          'https://assets.mixkit.co/videos/preview/mixkit-neon-lights-in-the-streets-of-a-night-city-43180-large.mp4'
        ];
        const newV = {
          id: Date.now(),
          user: { username: 'tu_usuario', name: 'Tú (Demo)', avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150' },
          title: title || 'Nuevo clip en TakTak 🚀',
          tags: tags ? tags.split(' ') : ['#taktak', '#short'],
          soundTitle: 'Tú — Sonido original',
          soundAvatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150',
          videoUrl: sampleVideos[Math.floor(Math.random() * sampleVideos.length)],
          likes: 1,
          liked: true,
          shares: 0,
          comments: []
        };
        setVideos([newV, ...videos]);
        setUploadModal(false);
        setActiveIndex(0);
      };

      return (
        <div className="app-viewport">
          {/* Header */}
          <header className="top-header-bar">
            <div className="brand-logo">TakTak 🎵</div>
            <div className="header-tabs">
              <button className={`header-tab-btn ${activeTab === 'following' ? 'active' : ''}`} onClick={() => setActiveTab('following')}>Siguiendo</button>
              <button className={`header-tab-btn ${activeTab === 'foryou' ? 'active' : ''}`} onClick={() => setActiveTab('foryou')}>Para ti</button>
            </div>
            <button
              style={{ background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.2)', color: '#25f4ee', borderRadius: '18px', padding: '5px 10px', fontSize: '11px', fontWeight: '700', cursor: 'pointer' }}
              onClick={() => setAiStudioModal(true)}
            >
              ✨ AI Studio
            </button>
          </header>

          {/* Feed */}
          <div ref={containerRef} className="feed-container">
            {videos.map((video, idx) => (
              <div key={video.id} className="video-slide" onClick={(e) => handleDoubleTap(e, video.id)}>
                <video
                  src={video.videoUrl}
                  className="video-player-element"
                  autoPlay={idx === activeIndex}
                  loop
                  muted={isMuted}
                  playsInline
                  ref={el => {
                    if (el) {
                      if (idx === activeIndex) { el.play().catch(()=>{}); }
                      else { el.pause(); }
                    }
                  }}
                />
                <div className="video-overlay-gradient"></div>

                {/* Floating Hearts */}
                {hearts.map(h => (
                  <div key={h.id} className="floating-heart" style={{ left: h.x, top: h.y }}>❤️</div>
                ))}

                {/* Mute toggle */}
                <button
                  style={{ position: 'absolute', top: '65px', right: '14px', background: 'rgba(0,0,0,0.5)', border: '1px solid rgba(255,255,255,0.15)', color: '#fff', borderRadius: '50%', width: '34px', height: '34px', cursor: 'pointer', zIndex: 15 }}
                  onClick={(e) => { e.stopPropagation(); setIsMuted(!isMuted); }}
                >
                  {isMuted ? '🔇' : '🔊'}
                </button>

                {/* Action Sidebar */}
                <aside className="action-sidebar" onClick={e => e.stopPropagation()}>
                  <div className="creator-avatar-container" onClick={() => setProfileModal(true)}>
                    <img src={video.user.avatar} className="creator-avatar" alt="avatar" />
                    <div className="follow-badge-plus">+</div>
                  </div>

                  <button className="action-btn-item" onClick={() => handleLike(video.id)}>
                    <div className={`action-icon-circle ${video.liked ? 'liked' : ''}`}>
                      {video.liked ? '❤️' : '🤍'}
                    </div>
                    <span className="action-label">{video.likes}</span>
                  </button>

                  <button className="action-btn-item" onClick={() => setCommentsModal(video)}>
                    <div className="action-icon-circle">💬</div>
                    <span className="action-label">{video.comments.length}</span>
                  </button>

                  <button className="action-btn-item" onClick={() => setShareModal(video)}>
                    <div className="action-icon-circle">↗️</div>
                    <span className="action-label">{video.shares}</span>
                  </button>

                  <div className="vinyl-sound-disc">
                    <img src={video.soundAvatar} alt="sound" />
                  </div>
                </aside>

                {/* Video Info */}
                <div className="video-meta-info">
                  <div className="creator-username">
                    @{video.user.username} <span className="verified-check">✓</span>
                  </div>
                  <div className="video-description">{video.title}</div>
                  <div className="video-tags-container">
                    {video.tags.map((t, i) => <span key={i} className="tag-badge">{t}</span>)}
                  </div>
                  <div className="sound-marquee-container">
                    <span>🎵</span> <span>{video.soundTitle}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {/* Bottom Nav */}
          <nav className="bottom-nav-bar">
            <button className={`nav-item-btn ${activeNav === 'home' ? 'active' : ''}`} onClick={() => setActiveNav('home')}>
              <span>🏠</span><span>Inicio</span>
            </button>
            <button className="nav-item-btn" onClick={() => setAiStudioModal(true)}>
              <span>✨</span><span>AI Studio</span>
            </button>
            <button className="nav-create-btn" onClick={() => setUploadModal(true)}>+</button>
            <button className="nav-item-btn" onClick={() => alert('🔥 Tendencias cargadas')}>
              <span>🔥</span><span>Explorar</span>
            </button>
            <button className="nav-item-btn" onClick={() => setProfileModal(true)}>
              <span>👤</span><span>Perfil</span>
            </button>
          </nav>

          {/* Comments Drawer */}
          {commentsModal && (
            <div className="drawer-backdrop" onClick={() => setCommentsModal(null)}>
              <div className="drawer-content" onClick={e => e.stopPropagation()}>
                <div className="drawer-header">
                  <div>{commentsModal.comments.length} comentarios</div>
                  <button className="close-btn" onClick={() => setCommentsModal(null)}>&times;</button>
                </div>
                <div className="comments-list">
                  {commentsModal.comments.map(c => (
                    <div key={c.id} className="comment-item">
                      <div className="comment-avatar" style={{ background: '#333', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>👤</div>
                      <div>
                        <div className="comment-user">@{c.username}</div>
                        <div className="comment-text">{c.text}</div>
                      </div>
                    </div>
                  ))}
                </div>
                <form className="comment-input-area" onSubmit={handleAddComment}>
                  <input
                    type="text"
                    className="comment-input"
                    placeholder="Añade un comentario..."
                    value={newComment}
                    onChange={e => setNewComment(e.target.value)}
                    autoFocus
                  />
                  <button type="submit" className="comment-send-btn">↑</button>
                </form>
              </div>
            </div>
          )}

          {/* Share Modal */}
          {shareModal && (
            <div className="drawer-backdrop" onClick={() => setShareModal(null)}>
              <div className="drawer-content" onClick={e => e.stopPropagation()}>
                <div className="drawer-header">
                  <div>Compartir vídeo</div>
                  <button className="close-btn" onClick={() => setShareModal(null)}>&times;</button>
                </div>
                <div className="modal-body">
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '12px', textAlign: 'center' }}>
                    <div style={{ cursor: 'pointer' }} onClick={() => { navigator.clipboard?.writeText(window.location.href); alert('¡Enlace copiado al portapapeles!'); }}>
                      <div style={{ width: '44px', height: '44px', borderRadius: '50%', background: '#25F4EE', color: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 4px' }}>🔗</div>
                      <span style={{ fontSize: '11px', color: '#ccc' }}>Copiar</span>
                    </div>
                    <div style={{ cursor: 'pointer' }} onClick={() => window.open('https://wa.me/')}>
                      <div style={{ width: '44px', height: '44px', borderRadius: '50%', background: '#25D366', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 4px' }}>💬</div>
                      <span style={{ fontSize: '11px', color: '#ccc' }}>WhatsApp</span>
                    </div>
                    <div style={{ cursor: 'pointer' }} onClick={() => window.open('https://twitter.com/')}>
                      <div style={{ width: '44px', height: '44px', borderRadius: '50%', background: '#1DA1F2', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 4px' }}>🐦</div>
                      <span style={{ fontSize: '11px', color: '#ccc' }}>Twitter</span>
                    </div>
                    <div style={{ cursor: 'pointer' }} onClick={() => window.open('https://telegram.org/')}>
                      <div style={{ width: '44px', height: '44px', borderRadius: '50%', background: '#0088cc', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 4px' }}>✈️</div>
                      <span style={{ fontSize: '11px', color: '#ccc' }}>Telegram</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Upload Modal */}
          {uploadModal && (
            <div className="drawer-backdrop" onClick={() => setUploadModal(false)}>
              <div className="drawer-content" onClick={e => e.stopPropagation()}>
                <div className="drawer-header">
                  <div>Subir nuevo vídeo 📤</div>
                  <button className="close-btn" onClick={() => setUploadModal(false)}>&times;</button>
                </div>
                <div className="modal-body">
                  <div className="form-group">
                    <label className="form-label">Título del vídeo</label>
                    <input id="up-title" type="text" className="form-input" defaultValue="Mi nuevo corto increíble" />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Hashtags</label>
                    <input id="up-tags" type="text" className="form-input" defaultValue="#taktak #trend #viral" />
                  </div>
                  <button
                    className="primary-btn"
                    onClick={() => {
                      const t = document.getElementById('up-title').value;
                      const tags = document.getElementById('up-tags').value;
                      handleUpload(t, tags);
                    }}
                  >
                    Publicar ahora 🚀
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* AI Studio Modal */}
          {aiStudioModal && (
            <div className="drawer-backdrop" onClick={() => setAiStudioModal(false)}>
              <div className="drawer-content" onClick={e => e.stopPropagation()}>
                <div className="drawer-header">
                  <div>✨ TakTak AI Studio (MoneyPrinterTurbo)</div>
                  <button className="close-btn" onClick={() => setAiStudioModal(false)}>&times;</button>
                </div>
                <div className="modal-body">
                  <div className="form-group">
                    <label className="form-label">Idea o tema para el vídeo</label>
                    <textarea id="ai-prompt" className="form-textarea" rows="2" defaultValue="5 curiosidades fascinantes sobre la inteligencia artificial 🤖" />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Estilo Visual</label>
                    <select className="form-select">
                      <option>Cyberpunk / Tech ⚡</option>
                      <option>Cinemático / Real 🎬</option>
                      <option>Anime / Ilustrado 🎨</option>
                    </select>
                  </div>
                  <button
                    className="ai-gradient-btn"
                    onClick={() => {
                      const prompt = document.getElementById('ai-prompt').value;
                      handleUpload(`🤖 AI: "${prompt}"`, '#aivideo #moneyprinterturbo #future');
                      setAiStudioModal(false);
                    }}
                  >
                    ⚡ Generar Vídeo con IA
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Profile Modal */}
          {profileModal && (
            <div className="drawer-backdrop" onClick={() => setProfileModal(false)}>
              <div className="drawer-content" onClick={e => e.stopPropagation()}>
                <div className="drawer-header">
                  <div>Perfil de Usuario</div>
                  <button className="close-btn" onClick={() => setProfileModal(false)}>&times;</button>
                </div>
                <div className="modal-body" style={{ textAlign: 'center' }}>
                  <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" style={{ width: '70px', height: '70px', borderRadius: '50%', margin: '0 auto', border: '3px solid #fe2c55' }} />
                  <h3 style={{ marginTop: '8px' }}>Usuario Creador</h3>
                  <div style={{ color: '#888', fontSize: '12px' }}>@tu_usuario</div>
                  <div style={{ display: 'flex', justifyContent: 'center', gap: '20px', margin: '14px 0', borderTop: '1px solid #222', borderBottom: '1px solid #222', padding: '10px 0' }}>
                    <div><strong>128</strong><div style={{ fontSize: '11px', color: '#777' }}>Siguiendo</div></div>
                    <div><strong>3.4k</strong><div style={{ fontSize: '11px', color: '#777' }}>Seguidores</div></div>
                    <div><strong>19.2k</strong><div style={{ fontSize: '11px', color: '#777' }}>Me gusta</div></div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
